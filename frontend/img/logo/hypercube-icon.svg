<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="NeuroVault">
<title>NeuroVault</title>
<desc>NeuroVault window and taskbar icon: the cube alone, filling its square, lit from the upper left. Colours come from CSS variables: --logo-ink (big cube, the theme text colour), --logo-accent (small cube),
--logo-bg (the theme background), --logo-tile (the tile, a step from the background toward the text colour),
--logo-light-theme (0 dark, 1 light). logo-vars.js makes them from a theme and accent. Without them it draws in Soft Slate and Sand.</desc>
