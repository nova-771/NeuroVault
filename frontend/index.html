<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroVault</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/tables.css"><!-- Build P: table controls and rich tables (mockups R48, R48b, R48c) -->

<body data-theme="obsidian" data-dark="true" data-accent="violet" data-font="opendyslexic" data-textsize="m" data-inspector="shown">
<!-- The window: the app draws its own window bar (frameless, R8). Everything inside #app is re-rendered by renderAll(). -->
<div class="frame" id="frame"><div class="app" id="app"></div></div>

<div class="win-edge" data-edge="n"></div><div class="win-edge" data-edge="s"></div><div class="win-edge" data-edge="e"></div><div class="win-edge" data-edge="w"></div>
<div class="win-edge" data-edge="nw"></div><div class="win-edge" data-edge="ne"></div><div class="win-edge" data-edge="sw"></div><div class="win-edge" data-edge="se"></div>
<!-- Plain files loaded in order, no build step. ?check=1 adds js/check.js (dev only). -->
<script src="js/mute.js"></script><!-- Build N (QC 71): ?mute=1 or ?check=1 mutes every sound (first, before anything can play) -->
<script src="js/log-r95.js"></script><!-- Build M (QC 95): page errors and long stalls into the app log (second, before anything else can fail) -->
<script src="js/icons.js"></script>
<script src="js/store.js"></script>

<script src="vendor/turndown-7.2.4.browser.umd.js"></script>
<script src="vendor/highlight-11.11.1.min.js"></script><!-- Build V (R57): code block colours (BSD-3-Clause, vendored, offline) -->

<script src="js/render-voice.js"></script><!-- Phase 6B: voice rambler -->

<script src="js/dictionary.js"></script><!-- Build J: the dictionary and thesaurus, your own words, the word popover -->

<script src="js/actions.js"></script>

<script src="js/ai-settings.js"></script><!-- Build N (R60): Settings → AI models reworked, one page or four tabs -->
<script src="js/ai-lock.js"></script><!-- R68: keep a project, folder or note off cloud AI (after ai-settings.js: it adds a section to its Overview tab) -->
<script src="js/agent-chat.js"></script><!-- Build N (R67): the Agent, in the Ask chat (agent.py) -->
<script src="js/ask-voice.js"></script><!-- Build N (R69): speak a question in Ask, the Agent and the floating window (after agent-chat.js and render-voice.js) -->
<script src="js/logo-vars.js"></script><!-- Build N: the logo's colours from a theme and accent (design/logo on claude/logo-04b80e) -->
<script src="js/logo.js"></script><!-- Build N: the hypercube in the window bar, and the window and taskbar icon, in your theme and accent (last: it wraps renderTitlebar) -->
